name: AFLW Lineup Poll

on:
  schedule:
    # GitHub Actions' finest schedule granularity is every 5 minutes, and on
    # the free tier actual trigger times can lag by several minutes further
    # (busier around the top of the hour). This is fine for catching an
    # announcement within ~5-15 minutes, but if you need near-instant alerts
    # specifically in the 5:45-6:00pm ACST window, a persistent host (like
    # the Railway option discussed earlier) will be more reliable for that.
    - cron: "*/5 * * * *"
  workflow_dispatch:      # lets you manually trigger a run from the Actions tab, for testing
    inputs:
      dry_run:
        description: "Dry run (log what would post to Discord, but don't actually post anything)"
        type: boolean
        default: false

permissions:
  contents: write   # needed so the workflow can commit updated state files back

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run one poll
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          AFL_MIS_TOKEN: ${{ secrets.AFL_MIS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python3 aflw_bot.py --once

      - name: Save state back to the repo
        run: |
          git config user.name "aflw-bot"
          git config user.email "aflw-bot@users.noreply.github.com"
          git add lineup_state.json round_pointer.json
          git diff --quiet --cached || git commit -m "Update lineup state [skip ci]"
          git push
